<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="/">Home.</a></div>
            <ul class="nav-links">
                
                <li><a href="/about.html">About Us</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="INDEX.html#contact">Contact Us</a></li>
                <li><a href="/register.html">Register here</a></li>
            </ul>
            <div class="burger">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            
        </nav>
    </header>

    <main class="login-container">
        <h1>Login</h1>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <span id="emailError" class="error"></span>
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="6">
                <span id="passwordStrength" class="strength"></span> <!-- Strength Indicator -->
                <span id="passwordError" class="error"></span> <!-- Error message -->
            </div>
            
            <button type="submit">Login</button>

           
            
        </form>
    </main>
    
    <footer>
        <p>&copy; All rights reserved | EASTERN COALFIELDS LIMITED</p>
    </footer>
    
    <script src="login.js"></script>
</body>
</html>
