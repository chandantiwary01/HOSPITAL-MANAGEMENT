<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration for New Patient</title>
    <link rel="stylesheet" href="register.css"> <!-- Combined CSS files into one -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="/">Home.</a></div>
            <ul class="nav-links">
                <li><a href="/about.html">About Us</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="INDEX.html#contact">Contact Us</a></li>
                <li><a href="/login.html">Login</a></li>
            </ul>
            <div class="burger">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </nav>
    </header>

    <main class="register-container">
        <h1>Register</h1>
        <form id="registerForm">
            <div class="input-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <span id="nameError" class="error"></span>
            </div>
            
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <span id="emailError" class="error"></span>
            </div>
            
            <div class="input-group password-wrapper">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="6">
                <span class="password-toggle-icon"><i class="fas fa-eye"></i></span>
                <span id="passwordStrength" class="strength"></span>
                <span id="passwordError" class="error"></span>
            </div>
            
            <button type="submit">Register</button>
            <p>Already have an account? <a href="/login.html">Login</a></p>
        </form>
    </main>
    
    <footer>
        <p>&copy; All rights reserved | EASTERN COALFIELDS LIMITED</p>
    </footer>
    
    <script src="register.js"></script>
</body>
</html>
